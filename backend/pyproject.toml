[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "betguard-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "SQLAlchemy>=2.0.40,<2.1",
  "alembic>=1.15,<2",
  "psycopg[binary]>=3.2.6,<4",
  "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "httpx>=0.28,<1"]
ml = ["scikit-learn>=1.6,<2", "tldextract>=5.3,<6", "skops>=0.13,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
