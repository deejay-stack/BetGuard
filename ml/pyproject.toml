[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "betguard-runtime"
version = "0.1.0"
requires-python = ">=3.11"
# Match the environment that produced the trusted, finalized joblib artifact.
dependencies = [
  "scikit-learn==1.9.1",
  "numpy==2.5.3",
  "pandas==3.0.6",
  "joblib==1.6.0",
  "tldextract==5.3.2",
]

[tool.setuptools]
packages = ["betguard_runtime"]
package-dir = {betguard_runtime = "src"}
